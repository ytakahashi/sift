# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches:
      - "main"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version:
          - 22.x
          - 24.x
          # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run format
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

  # Checks that the Electron app still packages. Code quality is covered by `build`, so this job
  # only builds, on the same Node.js version as release-electron.yml.
  package-macos:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run build:mac:dev

      # The output directory depends on the runner architecture (e.g. dist/mac-arm64), so search
      # for the bundle instead of hardcoding its path.
      - name: Verify app bundle
        run: |
          APP_PATH=$(find dist -maxdepth 3 -type d -name "Sift.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "Sift.app was not found"
            exit 1
          fi
          if ! plutil -p "$APP_PATH/Contents/Info.plist" | grep -q '"sift"'; then
            echo "The sift:// URL scheme is not registered in Info.plist"
            exit 1
          fi
