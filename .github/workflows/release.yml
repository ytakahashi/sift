name: Release

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: 'Release type'
        required: true
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch
      dry-run:
        description: 'Dry run (skip npm publish upload, git push, and GitHub Release)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set version
        run: pnpm version ${{ github.event.inputs.release-type }}

      - name: Get version
        id: package_version
        run: |
          VERSION=$(npm pkg get version | tr -d '"')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Check code quality
        run: |
          pnpm run format
          pnpm run lint
          pnpm run typecheck
          pnpm run test

      - name: Build
        run: pnpm run build:npm

      - name: Check package
        run: pnpm run package:check

      - name: Publish to npm
        run: |
          if [ "${{ github.event.inputs.dry-run }}" = "true" ]; then
            npm publish --access public --ignore-scripts --dry-run
          else
            npm publish --access public --ignore-scripts
          fi

      - name: Push changes
        if: github.event.inputs.dry-run != 'true'
        run: |
          git push origin HEAD:${{ github.ref_name }}
          git push origin v${{ steps.package_version.outputs.VERSION }}

      - name: Create Release
        if: github.event.inputs.dry-run != 'true'
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.package_version.outputs.VERSION }}
          draft: true
          generate_release_notes: true
