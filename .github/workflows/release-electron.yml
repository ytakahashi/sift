name: Release Electron App

# Builds the signed and notarized macOS app. Two entry points:
#
# - workflow_call from `release.yml`: builds `github.sha` with the upcoming version applied, before
#   anything is published, and hands the app over as a workflow artifact. `release.yml` attaches
#   it to the GitHub Release once every build has succeeded.
# - workflow_dispatch: rebuilds the app for an existing tag and attaches it to that (still draft)
#   Release, e.g. when only the app build failed.

on:
  workflow_call:
    inputs:
      version:
        description: Version to build, applied on top of the caller's commit
        required: true
        type: string
      dry-run:
        description: Dry run (build and verify only)
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to build (any ref when dry run)
        required: true
        type: string
      dry-run:
        description: Dry run (skip tag validation and GitHub Release upload)
        required: false
        default: false
        type: boolean

# `inputs.tag` is only set on workflow_dispatch and `inputs.version` only on workflow_call.
concurrency:
  group: release-electron-${{ inputs.tag || inputs.version }}

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    environment: release-macos
    timeout-minutes: 60

    steps:
      # On workflow_call `github.sha` is the caller's commit, i.e. the one `release.yml` tags.
      - name: Checkout target ref
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # The input is free-form, so make sure it is a tag and that it matches
      # the version baked into the artifacts.
      - name: Verify tag
        if: ${{ inputs.tag && !inputs.dry-run }}
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! git rev-parse --verify "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG is not a tag"
            exit 1
          fi
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$TAG" ]; then
            echo "Tag $TAG does not match package version v$VERSION"
            exit 1
          fi

      # The version commit does not exist yet, so reproduce its only change here.
      # electron-builder takes the app version and artifact names from package.json.
      - name: Apply release version
        if: ${{ inputs.version }}
        env:
          VERSION: ${{ inputs.version }}
        run: npm pkg set version="$VERSION"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `notarytool --key` takes a path, not the key material, so the base64 encoded
      # .p8 stored in the secret has to be materialized on disk first.
      - name: Prepare App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ]; then
            echo "APPLE_API_KEY secret is not available to this job"
            exit 1
          fi
          KEY_DIR="$RUNNER_TEMP/private_keys"
          mkdir -p "$KEY_DIR"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$KEY_DIR/AuthKey.p8"
          if ! grep -q "BEGIN PRIVATE KEY" "$KEY_DIR/AuthKey.p8"; then
            echo "APPLE_API_KEY must hold the base64 encoded App Store Connect .p8 key"
            exit 1
          fi
          echo "APPLE_API_KEY=$KEY_DIR/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build application
        run: pnpm run build:mac
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Verify signature and notarization
        shell: bash
        run: |
          APP_PATH=$(find dist -maxdepth 3 -type d -name "Sift.app" -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "Sift.app was not found"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --verbose --type exec "$APP_PATH"
          xcrun stapler validate "$APP_PATH"

      # `release.yml` downloads this artifact by name to attach it to the Release.
      - name: Upload assets as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: sift-macos
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 1

      # Without `draft: true` the action publishes the draft Release after uploading.
      - name: Upload assets to GitHub Release
        if: ${{ inputs.tag && !inputs.dry-run }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          draft: true
          fail_on_unmatched_files: true
          files: dist/*.dmg
